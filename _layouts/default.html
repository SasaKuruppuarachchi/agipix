<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
{% include head.html %}
<body class="layout-{{ page.layout | default: 'default' }}{% if page.url == '/' %} page-home{% endif %}{% if page.body_class %} {{ page.body_class }}{% endif %}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include site-header.html %}

  <main class="container{% if page.layout == 'doc' or page.docs_viewer %} container--docs{% endif %}" id="main" tabindex="-1">
    {{ content }}
  </main>

  {% include footer.html %}
  {% include lightbox.html %}
  {% include cmdk.html %}
  <div class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
