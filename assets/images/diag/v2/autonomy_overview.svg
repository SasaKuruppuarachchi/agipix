<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">AgiPIX v2.0 autonomy overview</title>
  <desc id="d">Sensors feed one selected odometry source. The agipix_auto process turns LiDAR scans and odometry into a ROG-Map, mission goals, SUPER trajectories and MPC attitude setpoints for PX4's AgiPix Auto external mode. The same odometry is relayed to PX4's EKF2 as vision odometry. Health and time-sync checks gate the pipeline.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c8c8c8"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8662e"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d4af37"/></marker>
  </defs>
  <style>
    text { font-family: "Inter", "Segoe UI", Helvetica, Arial, sans-serif; fill: #ececec; }
    .h { font-size: 15px; font-weight: 700; letter-spacing: .08em; fill: #e8662e; }
    .t { font-size: 17px; font-weight: 600; }
    .s { font-size: 13.5px; fill: #b4b4b4; }
    .l { font-size: 13px; fill: #c8c8c8; }
    .box { fill: #1f1f1f; stroke: #464646; stroke-width: 1.5; }
    .alt { fill: #1a1a1a; stroke: #464646; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .core { fill: #241a14; stroke: #e8662e; stroke-width: 1.5; }
    .panel { fill: #161616; stroke: #333; stroke-width: 1.2; }
    .w { stroke: #c8c8c8; stroke-width: 2; fill: none; }
    .o { stroke: #e8662e; stroke-width: 2.4; fill: none; }
    .g { stroke: #d4af37; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
  </style>
  <rect width="1200" height="640" rx="14" fill="#121212"/>

  <!-- column headings -->
  <text class="h" x="40" y="44">SENSORS</text>
  <text class="h" x="290" y="44">ODOMETRY (ONE SOURCE)</text>
  <text class="h" x="560" y="44">AGIPIX_AUTO (ONE PROCESS)</text>
  <text class="h" x="960" y="44">PX4</text>

  <!-- sensors -->
  <rect class="box" x="30" y="66" width="214" height="78" rx="9"/>
  <text class="t" x="46" y="96">Livox Mid-360</text>
  <text class="s" x="46" y="118">LiDAR + IMU, 10 Hz scans</text>
  <text class="s" x="46" y="136">mounted 45° nose-down</text>
  <rect class="box" x="30" y="164" width="214" height="78" rx="9"/>
  <text class="t" x="46" y="194">PX4 (Cube Orange+)</text>
  <text class="s" x="46" y="216">IMU, vehicle state</text>
  <text class="s" x="46" y="234">over uXRCE-DDS</text>
  <rect class="alt" x="30" y="262" width="214" height="78" rx="9"/>
  <text class="t" x="46" y="292">Isaac Sim + PX4 SITL</text>
  <text class="s" x="46" y="314">the same interfaces</text>
  <text class="s" x="46" y="332">in simulation</text>

  <!-- odometry -->
  <rect class="box" x="280" y="66" width="226" height="78" rx="9"/>
  <text class="t" x="296" y="96">LiDAR-inertial (LIO)</text>
  <text class="s" x="296" y="118">AGIptive-LIOM, ongoing work</text>
  <text class="s" x="296" y="136">real drone and simulation</text>
  <rect class="alt" x="280" y="164" width="226" height="64" rx="9"/>
  <text class="t" x="296" y="192">Ground truth</text>
  <text class="s" x="296" y="214">simulation only</text>
  <rect class="alt" x="280" y="246" width="226" height="64" rx="9"/>
  <text class="t" x="296" y="274">Motion capture</text>
  <text class="s" x="296" y="296">OptiTrack or Vicon</text>
  <rect class="panel" x="280" y="330" width="226" height="56" rx="9"/>
  <text class="l" x="296" y="354">One TF owner publishes</text>
  <text class="l" x="296" y="373">world → base_link</text>

  <!-- agipix_auto core -->
  <rect x="546" y="60" width="384" height="420" rx="12" fill="#191513" stroke="#5a3a28" stroke-width="1.4"/>
  <rect class="core" x="566" y="76" width="344" height="58" rx="9"/>
  <text class="t" x="582" y="101">Scan ingest</text>
  <text class="s" x="582" y="122">per-point deskew of each LiDAR scan</text>
  <rect class="core" x="566" y="152" width="344" height="58" rx="9"/>
  <text class="t" x="582" y="177">ROG-Map</text>
  <text class="s" x="582" y="198">sliding occupancy grid with frontiers</text>
  <rect class="core" x="566" y="228" width="344" height="74" rx="9"/>
  <text class="t" x="582" y="253">Mission layer</text>
  <text class="s" x="582" y="274">exploration · waypoints · area scan</text>
  <text class="s" x="582" y="292">global route guidance · return home</text>
  <rect class="core" x="566" y="320" width="344" height="74" rx="9"/>
  <text class="t" x="582" y="345">SUPER planner · 10 Hz</text>
  <text class="s" x="582" y="366">exploratory + backup trajectories</text>
  <text class="s" x="582" y="384">in CIRI safe corridors · FOV-aware yaw</text>
  <rect class="core" x="566" y="412" width="344" height="54" rx="9"/>
  <text class="t" x="582" y="436">MPC · 100 Hz</text>
  <text class="s" x="582" y="456">tracks the committed trajectory</text>
  <path class="o" d="M738 134 V150"/>
  <path class="o" d="M738 210 V226"/>
  <path class="o" d="M738 302 V318"/>
  <path class="o" d="M738 394 V410"/>

  <!-- PX4 -->
  <rect class="box" x="956" y="66" width="214" height="96" rx="9"/>
  <text class="t" x="972" y="96">Mode executor</text>
  <text class="s" x="972" y="118">arm → takeoff →</text>
  <text class="s" x="972" y="136">AgiPix Auto → land</text>
  <rect class="box" x="956" y="182" width="214" height="96" rx="9" style="stroke:#e8662e"/>
  <text class="t" x="972" y="212">AgiPix Auto mode</text>
  <text class="s" x="972" y="234">external mode via the</text>
  <text class="s" x="972" y="252">px4-ros2 interface</text>
  <rect class="box" x="956" y="298" width="214" height="96" rx="9" style="stroke:#d4af37"/>
  <text class="t" x="972" y="328">EKF2</text>
  <text class="s" x="972" y="350">fuses vision odometry;</text>
  <text class="s" x="972" y="368">no GPS, no compass</text>
  <rect class="panel" x="956" y="412" width="214" height="54" rx="9"/>
  <text class="l" x="972" y="436">Position, attitude and</text>
  <text class="l" x="972" y="455">motor control loops</text>
  <path class="w" d="M1063 162 V180" marker-end="url(#a)"/>
  <path class="w" d="M1063 394 V410" marker-end="url(#a)"/>

  <!-- arrows -->
  <path class="w" d="M244 105 H278" marker-end="url(#a)"/>
  <path class="w" d="M244 203 H262 V118 H278" marker-end="url(#a)"/>
  <path class="w" d="M244 300 Q262 300 262 230 V196 H278" marker-end="url(#a)" style="stroke-dasharray:5 5"/>
  <path class="w" d="M137 66 V34 Q137 22 149 22 H518 Q530 22 530 34 V104 H564" marker-end="url(#a)"/>
  <text class="l" x="420" y="16" text-anchor="middle" style="font-size:12px">point cloud</text>
  <path class="w" d="M506 236 H534 V181 H564" marker-end="url(#a)"/>
  <text class="l" x="520" y="226" text-anchor="end" style="font-size:12px">odometry</text>
  <path class="o" d="M910 439 H934 V230 H954" marker-end="url(#ao)"/>
  <text class="l" x="944" y="300" transform="rotate(-90 944 300)" text-anchor="middle" style="fill:#e8662e">attitude + thrust</text>
  <path class="g" d="M393 386 V512 H1186 V346 H1174" marker-end="url(#ag)"/>
  <text class="l" x="728" y="504" text-anchor="middle" style="fill:#d4af37">the same odometry, sent to PX4 as external vision</text>

  <!-- time sync and safety band -->
  <rect x="30" y="540" width="1140" height="78" rx="10" fill="#17171a" stroke="#3b3b46" stroke-width="1.3"/>
  <text class="h" x="50" y="568" style="fill:#d4af37">TIME SYNC AND SAFETY</text>
  <text class="s" x="50" y="594">LiDAR on PTP time from the Jetson · the LIO starts only once the LiDAR clock is in sync · PX4 on uXRCE-DDS timesync</text>
  <text class="s" x="50" y="612">SUPER always keeps a backup trajectory in observed free space · PX4 failsafes end in Land · the pilot can always take over on RC</text>
</svg>
